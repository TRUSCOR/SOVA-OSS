name: Publish to PyPI

# Publishes one tagged release of sova-oss through PyPI Trusted Publishing (OIDC). No token
# exists anywhere: PyPI trusts this exact workflow, in this repository, in the named environment.
# It runs only when dispatched by hand with the tag and the index, so a pushed tag alone never
# publishes. Dispatch with index "testpypi" first, then "pypi".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string
      index:
        description: Package index
        required: true
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize exact environment
        run: uv sync --locked

      - name: Require the tag to match the package version
        env:
          TAG: ${{ inputs.tag }}
        run: uv run --locked python scripts/check_release_version.py "$TAG"

      - name: Run the test suite
        run: uv run --locked python -m pytest -q

      - name: Build wheel and source distribution
        run: uv build

      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/sova" --version
          "$RUNNER_TEMP/smoke/bin/sova" --help > /dev/null
          "$RUNNER_TEMP/smoke/bin/sova" calibrate --help > /dev/null

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * | tee ../SHA256SUMS

      - name: Keep the distributions for the publish job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sova-oss-dist-${{ inputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/project/sova-oss/' || 'https://pypi.org/project/sova-oss/' }}
    permissions:
      id-token: write
    steps:
      - name: Fetch the built distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: sova-oss-dist-${{ inputs.tag }}
          path: dist/

      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
